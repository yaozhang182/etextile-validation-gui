name: Build Windows app

# Produces a self-contained Windows build so non-technical users do not have to
# install Python, conda, or any dependencies. PyInstaller cannot cross-compile,
# so this must run on a Windows runner even though development happens on Linux.

on:
  push:
    tags: ['v*']
  workflow_dispatch:        # lets you trigger a build by hand from the Actions tab

# Creating the GitHub Release on a tag needs write access; the default token is
# read-only on newer repositories.
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'      # MediaPipe 0.10.x has no 3.12 wheels
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch: the default wheel bundles CUDA (~1.2 GB) and this
          # toolchain trains on CPU by design.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install PyQt6 pyinstaller

      - name: Sanity-check imports before building
        run: python -c "import PyQt6, mediapipe, torch, cv2, sklearn, matplotlib; print('imports OK')"

      - name: Build
        run: pyinstaller packaging/etextile.spec --noconfirm

      - name: Verify the bundle contains MediaPipe's model assets
        shell: bash
        run: |
          # The most common packaging failure: the app builds fine but crashes
          # at runtime because these are missing. Fail here instead.
          found=$(find dist/ETextileValidation -name 'pose_landmark*.tflite' | wc -l)
          echo "pose_landmark tflite files found: $found"
          if [ "$found" -eq 0 ]; then
            echo "::error::MediaPipe pose models missing from the bundle"
            exit 1
          fi

      - name: Verify the stylesheet was bundled
        shell: bash
        run: |
          # style.qss is a data file; if the spec's datas entry is lost the app
          # still starts but looks unstyled, which is easy to miss in a zip.
          found=$(find dist/ETextileValidation -name 'style.qss' | wc -l)
          echo "style.qss files found: $found"
          if [ "$found" -eq 0 ]; then
            echo "::error::gui/style.qss missing from the bundle"
            exit 1
          fi

      - name: Verify the icons were bundled
        shell: bash
        run: |
          found=$(find dist/ETextileValidation -name 'circle-help.svg' | wc -l)
          echo "icon svgs found: $found"
          if [ "$found" -eq 0 ]; then
            echo "::error::gui/icons missing from the bundle"
            exit 1
          fi

      - name: Self-test the packaged executable
        shell: bash
        run: |
          # Runs against the BUILT binary, not the source tree: imports every
          # heavy dependency, loads MediaPipe's model assets, and performs one
          # real training + evaluation step. A build can otherwise succeed and
          # still be dead on first use — v0.2.0 shipped with a pruned torch
          # submodule and crashed the moment the user pressed Start Training.
          # No "|| true" here: this failing must fail the build.
          ./dist/ETextileValidation/ETextileValidation.exe --selftest

      - name: Package
        shell: bash
        run: |
          cd dist
          7z a -tzip ETextileValidation-windows.zip ETextileValidation/
          ls -lh ETextileValidation-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ETextileValidation-windows
          path: dist/ETextileValidation-windows.zip
          retention-days: 30

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ETextileValidation-windows.zip
